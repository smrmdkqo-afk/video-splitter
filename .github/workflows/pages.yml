name: Build and deploy Video Splitter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Generate installation icons
        run: npm run icons:generate
      - run: npm test
      - name: Ensure FFmpeg is available for generated-media tests
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
      - run: npm run test:media
      - run: npm run test:resize
      - run: npm run build
      - name: Verify installation assets and record deployment hashes
        run: |
          test -s dist/manifest.webmanifest
          test -s dist/icons/icon-192.png
          test -s dist/icons/icon-512.png
          test -s dist/icons/maskable-512.png
          test -s dist/icons/apple-touch-icon.png
          sha256sum dist/index.html dist/manifest.webmanifest dist/icons/*.png dist/assets/*
      - name: Upload Pages build
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  pages-status:
    name: Check Pages setup
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pages: read
    outputs:
      ready: ${{ steps.pages.outputs.ready }}
    steps:
      - name: Check existing Pages configuration (read only)
        id: pages
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const settings = `https://github.com/${context.repo.owner}/${context.repo.repo}/settings/pages`;
            let ready = false;
            let detail = '';
            try {
              const { data } = await github.rest.repos.getPages(context.repo);
              ready = data.build_type === 'workflow';
              detail = ready ? 'Pages is enabled with GitHub Actions.' : 'Pages exists, but its source must be set to GitHub Actions.';
            } catch (error) {
              if (![403, 404].includes(error.status)) throw error;
              detail = `Pages is not enabled or is unavailable to this workflow (HTTP ${error.status}).`;
            }
            core.setOutput('ready', String(ready));
            if (!ready) core.notice('Deployment skipped: open Settings > Pages and select GitHub Actions. A private repository requires a Pages-eligible paid plan. Repository visibility has not been changed.');
            await core.summary.addHeading(ready ? 'Pages ready' : 'Pages activation required')
              .addRaw(detail + '\n\n')
              .addLink('Open repository Pages settings', settings)
              .addRaw('\n\nAfter selecting GitHub Actions, run this workflow again from the Actions tab. This workflow does not change repository visibility, billing, or Pages administration settings.\n')
              .write();

  deploy:
    name: Deploy GitHub Pages
    needs: [build, pages-status]
    if: needs.pages-status.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages metadata
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
